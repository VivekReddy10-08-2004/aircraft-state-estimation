[project]
name = "aircraft-state-estimation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VivekReddy10-08-2004", email = "vivek.bhimavarapu@maine.edu" }
]
requires-python = ">=3.12"
dependencies = [
    # Data processing
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",

    # OpenSky data ingestion
    "pyopensky",
    "httpx",
    "tqdm",

    # Geospatial transformations
    "pyproj",

    # Classical state estimation
    "filterpy",

    # Neural networks
    "torch",

    # Evaluation and statistics
    "scikit-learn",
    "statsmodels",

    # Visualization
    "matplotlib",
    "seaborn",

    # Experiment management
    "pyyaml",
    "python-dotenv",

    # Notebooks
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true

[project.scripts]
aircraft-state-estimation = "aircraft_state_estimation:main"
normalize-opensky = "aircraft_state_estimation.data.cli:main"
build-baseline = "aircraft_state_estimation.baseline_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
